<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leonardo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="overlay"></div>
  <canvas id="particles"></canvas>

  <audio id="bgm" src="music.mp3" loop preload="none"></audio>

  <div class="enter-screen" id="enterScreen">
    <div class="enter-box">
      <div class="enter-glow"></div>
      <h1>Leonardo</h1>
      <p>clique para entrar</p>
      <button class="enter-btn" id="enterBtn">
        <i class="fa-solid fa-play"></i> Entrar
      </button>
    </div>
  </div>

  <main class="hero">
    <section class="profile-shell">
      <div class="top-symbol">
        <i class="fa-solid fa-music"></i>
      </div>

      <div class="avatar-wrap">
        <img class="avatar" src="image.jpeg" alt="Foto de Leonardo">
      </div>

      <h1 class="name">Leonardo</h1>
      <p class="tagline">skatista • gamer</p>

      <div class="location-line">
        <i class="fa-solid fa-location-dot"></i>
        <span>São Vicente, Brazil</span>
      </div>

      <div class="presence-pill">
        <div class="presence-left">
          <i class="fa-brands fa-discord"></i>
          <span id="discordStatus">Online — ouvindo música</span>
        </div>
        <div class="status-dot"></div>
      </div>

      <div class="social-row">
        <a class="social-btn" href="https://www.instagram.com/sk8leo12/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>

        <a class="social-btn" href="https://open.spotify.com/user/227hnu57uuqopg6m7xxww3k5q?si=21374a4e9cf241bf" target="_blank" rel="noopener noreferrer" aria-label="Perfil do Spotify" title="Meu perfil no Spotify">
          <i class="fa-brands fa-spotify"></i>
        </a>

        <a class="social-btn" href="https://www.tiktok.com/@sk8leo18" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>

        <a class="social-btn" href="https://discord.com/" target="_blank" rel="noopener noreferrer" aria-label="Discord" title="Discord">
          <i class="fa-brands fa-discord"></i>
        </a>
      </div>

      <div class="stats-row">
        <div class="mini-stat">
          <i class="fa-solid fa-eye"></i>
          <strong id="viewCounter">12.400</strong>
        </div>

        <div class="mini-stat">
          <i class="fa-regular fa-clock"></i>
          <strong id="liveClock">00:00</strong>
        </div>
      </div>

      <div class="music-panel">
        <div class="music-meta">
          <img class="track-cover" src="lowlife-cover.png" alt="Capa de Low Life">
          <div class="music-text">
            <strong>Tocando agora</strong>
            <span>The Weeknd, Future — Low Life</span>
          </div>
          <button class="play-btn" id="playBtn" aria-label="Tocar/Pausar">
            <i class="fa-solid fa-play"></i>
          </button>
        </div>

        <div class="player-controls">
          <span class="time-current" id="timeCurrent">0:00</span>
          <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1">
          <span class="time-total" id="timeTotal">0:00</span>
        </div>

        <div class="volume-row">
          <i class="fa-solid fa-volume-high"></i>
          <input type="range" id="volumeBar" class="volume-bar" min="0" max="100" value="55">
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
